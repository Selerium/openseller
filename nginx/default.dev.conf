upstream backend {
    server backend:3000;
}

server {
    listen 80;
    server_name _;

    # raised from 6m: product image uploads go through here, and a 6m default silently
    # truncates a large batch of images with a 413 that looks like an app bug
    client_max_body_size 25m;

    # API under an /api prefix, so the frontend never needs to know a backend port.
    # The trailing slash on proxy_pass is what strips the /api prefix, keeping
    # backend routes flat ("/products", not "/api/products").
    location /api/ {
        proxy_pass http://backend/;

        proxy_http_version 1.1;

        # WebSocket upgrades for /api/realtime. Unconditional `Connection: upgrade` is
        # safe here because the upstream block configures no keepalive pool; plain
        # requests pass through untouched either way.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Product media. Matched before the catch-all so it is never treated as an API call.
    # Uploads are written by the backend to a bind-mounted directory, so they are proxied
    # rather than served from nginx's own root.
    location /uploads/ {
        proxy_pass http://backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket support
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
}
