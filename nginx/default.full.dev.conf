# Needed so the per-location `Connection $connection_upgrade` below can echo the client's
# Upgrade header when there is one, and send "close" otherwise. Sending `Connection: upgrade`
# unconditionally breaks plain HTTP/1.1 requests from some clients.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Dev, single-origin: nginx serves both the API and the Next.js frontend.
upstream backend {
    server backend:3000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # API under an /api prefix, so the frontend never needs to know a backend port.
    # The prefix is stripped so backend routes stay flat ("/products", not "/api/products").
    location /api/ {
        proxy_pass http://backend/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Product media lives on disk, so serve it directly rather than streaming it via Node.
    location /uploads/ {
        proxy_pass http://backend;
    }

    location / {
        proxy_pass http://frontend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # Next.js dev needs the client's Upgrade/Connection headers passed through untouched,
        # otherwise hot-reload websockets never connect and the browser just retries forever.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # dev only: never buffer, or HMR feels laggy
        proxy_buffering off;
    }
}